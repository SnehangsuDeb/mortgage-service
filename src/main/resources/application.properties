spring.application.name=mortgage-service
server.port=8080

# Expose common actuator endpoints
management.endpoints.web.exposure.include=mortgage,info
management.endpoint.mortgage.probes.enabled=true

# H2 in-memory database configuration
spring.datasource.url=jdbc:h2:mem:mortgagedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate settings (no schema generation by default)
spring.jpa.hibernate.ddl-auto=none
# Dialect auto-detected in Boot 3, but can be set explicitly:
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
