spring.application.name=mortgage-service
server.port=8080

# Expose common actuator endpoints
management.endpoints.web.exposure.include=mortgage,info
management.endpoint.mortgage.probes.enabled=true

# H2 in-memory database configuration
spring.datasource.url=jdbc:h2:mem:mortgagedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate settings and SQL logging
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging levels for SQL and parameter binding
#logging.level.org.hibernate.SQL=ERROR
#logging.level.org.hibernate.orm.jdbc.bind=ERROR
#logging.level.org.h2=ERROR

# Application logging to console
logging.level.root=INFO
# Spring framework logs
logging.level.org.springframework=INFO
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.web=INFO
# Your application logs (ensure INFO/DEBUG are visible)
logging.level.com.example.mortgageservice=DEBUG
# Console formatting
spring.output.ansi.enabled=ALWAYS
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=true
