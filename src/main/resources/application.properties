spring.application.name=mortgage-service
server.port=8080

# Expose common actuator endpoints
management.endpoints.web.exposure.include=mortgage,info
management.endpoint.mortgage.probes.enabled=true

# H2 in-memory database configuration
spring.datasource.url=jdbc:h2:mem:mortgagedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;TRACE_LEVEL_SYSTEM_OUT=3
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate settings and SQL logging
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging levels for SQL and parameter binding
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.h2=DEBUG

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=true
